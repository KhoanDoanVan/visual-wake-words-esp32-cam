[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vww-esp32"
version = "0.1.0"
description = "Notebook-first COCO Visual Wake Words training and ESP32-CAM export pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2.2",
  "pandas>=2.2,<3",
  "pillow>=10.3,<13",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "tensorflow>=2.16,<2.21",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["nbformat>=5.10,<6", "pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
