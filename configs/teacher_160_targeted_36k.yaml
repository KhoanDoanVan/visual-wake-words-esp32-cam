project:
  name: visual-wake-words-targeted-36k-teacher-160
  seed: 42

paths:
  raw: data/raw/coco2017
  processed: data/processed
  artifacts: artifacts/high_resolution_teacher_160_targeted_36k

data:
  dataset: MS COCO 2017
  # Generated by optimization/high_resolution/02_targeted_coco_teacher_160.ipynb.
  manifest: data/processed/manifest_teacher_160_targeted_36k.csv
  reference_manifest: data/processed/manifest.csv
  train_annotations: data/raw/coco2017/annotations/instances_train2017.json
  test_annotations: data/raw/coco2017/annotations/instances_val2017.json
  image_root: data/raw/coco2017/images
  target_category: person
  # Canonical VWW threshold: the largest person box covers at least 0.5% of the image.
  min_person_area_fraction: 0.005
  validation_fraction: 0.15
  # Retain the previous 12k train rows, include every eligible small-person
  # example, then fill a balanced 36k curriculum from the complete train2017 pool.
  target_train_samples: 36000
  target_positive_samples: 18000
  target_negative_samples: 18000
  include_all_small_person: true
  small_person_max_area_fraction: 0.025
  target_medium_positive_samples: 5169
  target_large_positive_samples: 5169
  # Reuse the exact previous validation/test IDs for a fair comparison.
  preserve_reference_validation_and_test: true
  download_workers: 12
  download_timeout_seconds: 45

preprocessing:
  image_size: [160, 160]
  channels: 3
  geometry: letterbox
  resize_method: bilinear
  antialias: true
  batch_size: 32
  shuffle_buffer: 16384
  cache: false

model:
  architecture: mobilenet_v1_teacher
  width_multiplier: 0.5
  imagenet_initialization: true
  dropout: 0.2
  l2: 0.00001

augmentation:
  horizontal_flip: true
  translation_fraction: 0.05
  brightness_delta: 0.18
  contrast_factor: 0.30
  saturation_factor: 0.45
  sensor_noise_stddev: 0.025

training:
  frozen_backbone_epochs: 8
  frozen_backbone_learning_rate: 0.0003
  fine_tune_epochs: 20
  fine_tune_learning_rate: 0.00003
  fine_tune_last_layers: 30
  label_smoothing: 0.03
  early_stopping_patience: 6
  reduce_lr_patience: 3
  monitor: val_pr_auc

evaluation:
  threshold_objective: f1
  minimum_recall: 0.80
  false_positive_cost: 1.0
  false_negative_cost: 2.0
  bootstrap_samples: 500

teacher_gate:
  # Targeted-data teacher must improve on the already strong 160x160 subset teacher.
  reference_report: artifacts/high_resolution_teacher_160/reports/test_metrics.json
  minimum_pr_auc_gain_vs_reference: 0.005
  minimum_f1_gain_vs_reference: 0.005
  maximum_specificity_drop: 0.01
