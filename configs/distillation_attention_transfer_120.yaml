project:
  name: vww-attention-transfer-student-120
  seed: 42

paths:
  manifest: data/processed/manifest.csv
  teacher_model: artifacts/high_resolution_teacher_160/models/teacher_160.keras
  corrected_control_model: artifacts/distillation/response_kd_alignment_student_120/models/same_view_lambda0.keras
  corrected_control_summary: artifacts/distillation/response_kd_alignment_student_120/reports/experiment_summary.json
  attention_paper: papers/distillation/03_attention_transfer_2016.pdf
  artifacts: artifacts/distillation/attention_transfer_student_120

data:
  teacher_size: [160, 160]
  student_size: [120, 120]
  channels: 3
  batch_size: 32

student:
  architecture: MobileNetV1
  width_multiplier: 0.25
  imagenet_initialization: true
  dropout: 0.1
  l2: 0.00001

attention:
  teacher_layer: conv_pw_11_relu
  student_layer: conv_pw_11_relu
  power: 2.0
  target_gradient_ratio: 0.10
  beta_minimum: 0.000001
  beta_maximum: 1000000.0
  epsilon: 0.000001

augmentation:
  translation_fraction: 0.05
  brightness_delta: 0.18
  contrast_factor: 0.30
  saturation_delta: 0.45
  sensor_noise_stddev: 0.025

training:
  head_epochs: 8
  head_learning_rate: 0.0003
  fine_tune_epochs: 20
  fine_tune_learning_rate: 0.00003
  fine_tune_last_layers: 30
  label_smoothing: 0.03
  early_stopping_patience: 6
  reduce_lr_patience: 3
  monitor: val_pr_auc

evaluation:
  threshold_objective: f1
  minimum_recall: 0.80
  false_positive_cost: 1.0
  false_negative_cost: 2.0
  bootstrap_samples: 1000

acceptance_gate:
  minimum_pr_auc_gain: 0.0
  maximum_f1_drop: 0.005
  maximum_specificity_drop: 0.01
  maximum_float_to_int8_probability_mae: 0.03
  require_graph_identity: true

export:
  representative_samples: 500
  model_filename: student_120_attention_transfer_int8.tflite
